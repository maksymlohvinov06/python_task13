<!doctype html>
<html>
  <head>
    <title>Автори бібліотеки</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 40px;
        background: #f4f4f9;
      }
      .header {
        display: flex;
        justify-content: space-between;
        background: white;
        padding: 20px;
        border: 1px solid #ccc;
        border-radius: 5px;
        margin-bottom: 20px;
      }
      .card {
        background: white;
        padding: 20px;
        border: 1px solid #ccc;
        border-radius: 5px;
        margin-bottom: 20px;
      }
      .btn {
        padding: 8px 15px;
        text-decoration: none;
        color: white;
        background: #007bff;
        border-radius: 3px;
        border: none;
        cursor: pointer;
      }
      .btn-danger {
        background: #dc3545;
      }
      .error {
        color: red;
        font-weight: bold;
        margin-bottom: 15px;
      }
      input {
        padding: 8px;
        margin-right: 10px;
        border: 1px solid #ccc;
        border-radius: 3px;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <h1>Автори</h1>
      <a href="/" class="btn">На головну</a>
    </div>

    {% if error %}
    <p class="error">{{ error }}</p>
    {% endif %}

    <div class="card">
      <h3>Додати нового автора</h3>
      <form method="POST" action="{% url 'add_author' %}">
        {% csrf_token %}
        <input type="text" name="name" placeholder="Ім'я" required />
        <input type="text" name="surname" placeholder="Прізвище" required />
        <input type="text" name="patronymic" placeholder="По батькові" />
        <button type="submit" class="btn">Додати</button>
      </form>
    </div>

    <div class="card">
      <h3>Список авторів</h3>
      {% for author in authors %}
      <div
        style="
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-bottom: 10px;
          border-bottom: 1px solid #eee;
          padding-bottom: 5px;
        "
      >
        <span
          ><strong>{{ author.name }} {{ author.surname }}</strong> {{
          author.patronymic }}</span
        >
        <a
          href="{% url 'delete_author' author.id %}"
          class="btn btn-danger"
          onclick="return confirm('Ви впевнені?');"
          >Видалити</a
        >
      </div>
      {% empty %}
      <p>Авторів поки немає.</p>
      {% endfor %}
    </div>
  </body>
</html>
