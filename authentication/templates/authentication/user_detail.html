<!doctype html>
<html>
  <head>
    <title>Профіль - {{ user_obj.first_name }}</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 40px;
        background: #f4f4f9;
      }
      .card {
        background: white;
        padding: 20px;
        border: 1px solid #ccc;
        border-radius: 5px;
      }
      .btn {
        padding: 8px 15px;
        text-decoration: none;
        color: white;
        background: #007bff;
        border-radius: 3px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Деталі користувача</h1>
      <p><strong>Ім'я:</strong> {{ user_obj.first_name }}</p>
      <p><strong>Прізвище:</strong> {{ user_obj.last_name }}</p>
      <p><strong>По батькові:</strong> {{ user_obj.middle_name }}</p>
      <p><strong>Email:</strong> {{ user_obj.email }}</p>
      <p>
        <strong>Роль:</strong> {% if user_obj.role == 1 %}Бібліотекар{% else
        %}Читач{% endif %}
      </p>
      <br />
      <a href="{% url 'user_list' %}" class="btn">Повернутися до списку</a>
    </div>
  </body>
</html>
