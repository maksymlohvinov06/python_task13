<!doctype html>
<html>
  <head>
    <title>Вхід</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 40px;
        background-color: #f4f4f9;
      }
      .container {
        max-width: 400px;
        margin: 0 auto;
        padding: 20px;
        background: white;
        border: 1px solid #ccc;
        border-radius: 5px;
      }
      input,
      button {
        width: 100%;
        margin-bottom: 15px;
        padding: 10px;
        box-sizing: border-box;
      }
      button {
        background-color: #007bff;
        color: white;
        border: none;
        cursor: pointer;
        font-size: 16px;
      }
      button:hover {
        background-color: #0056b3;
      }
      .error {
        color: red;
        margin-bottom: 15px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Вхід в систему</h2>
      {% if error %}
      <div class="error">{{ error }}</div>
      {% endif %}

      <form method="POST">
        {% csrf_token %}
        <label>Email:</label>
        <input type="email" name="email" required />

        <label>Пароль:</label>
        <input type="password" name="password" required />

        <button type="submit">Увійти</button>
      </form>
      <div style="text-align: center">
        <a href="{% url 'register' %}">Немає акаунту? Зареєструватися</a>
      </div>
    </div>
  </body>
</html>
