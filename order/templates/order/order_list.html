<!doctype html>
<html>
  <head>
    <title>Замовлення</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 40px;
        background: #f4f4f9;
      }
      .header {
        display: flex;
        justify-content: space-between;
        background: white;
        padding: 20px;
        border: 1px solid #ccc;
        border-radius: 5px;
        margin-bottom: 20px;
      }
      .card {
        background: white;
        padding: 15px;
        border: 1px solid #ccc;
        margin-bottom: 10px;
        border-radius: 5px;
      }
      .btn {
        padding: 8px 15px;
        text-decoration: none;
        color: white;
        background: #007bff;
        border-radius: 3px;
        border: none;
        cursor: pointer;
      }
      .btn-danger {
        background: #dc3545;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <h1>Список замовлень</h1>
      <a href="/" class="btn">На головну</a>
    </div>

    {% for order in orders %}
    <div class="card">
      <p><strong>Книга:</strong> {{ order.book.name }}</p>
      <p><strong>Читач:</strong> {{ order.user.email }}</p>

      {% if user.role == 1 %}
      <form
        method="POST"
        action="{% url 'close_order' order.id %}"
        style="margin-top: 10px"
      >
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">
          Повернути книгу (Закрити)
        </button>
      </form>
      {% endif %}
    </div>
    {% empty %}
    <p>Замовлень поки немає.</p>
    {% endfor %}
  </body>
</html>
